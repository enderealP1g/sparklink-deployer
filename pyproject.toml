[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklink-deployer"
version = "0.3.0a1"
description = "Plan-first capability-driven SparkLink VPS deployment orchestrator"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "enderealP1g"}]

[project.scripts]
sparklinkctl = "sparklink_deployer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
