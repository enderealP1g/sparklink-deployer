name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: python tools/secret_scan.py .
      - name: Shell syntax
        run: bash -n install.sh sparklinkctl
      - name: PowerShell entrypoint
        shell: pwsh
        run: ./sparklinkctl.ps1 --version
